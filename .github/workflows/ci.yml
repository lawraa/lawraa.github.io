name: CI

# Lint, build and smoke-test every page in Chrome on pushes to branches other than main
# (main is covered by the deploy workflow). Pull requests only run here when they come
# from a fork; a branch in this repo is already covered by its push.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          npx vite preview --port 4173 --strictPort &
          curl --retry 10 --retry-connrefused --retry-delay 1 -s -o /dev/null http://localhost:4173/
          CHROME_PATH="$(which google-chrome)" npm run smoke
