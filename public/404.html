<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawrance Chen</title>
    <script>
      // The site uses hash routes, so send /work to /#/work and anything unknown to the home page.
      var routes = ['/work', '/publications', '/bouldering', '/drawing']
      var path = location.pathname.replace(/\/+$/, '')
      location.replace(routes.indexOf(path) >= 0 ? '/#' + path : '/')
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body style="background:#eef1ec"></body>
</html>
