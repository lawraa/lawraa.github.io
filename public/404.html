<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawrance Chen</title>
    <script>
      // The site uses hash routes, so send /work to /#/work, the old Resume page to the PDF,
      // and anything unknown to the home page. Keep in sync with src/pages.ts (the smoke test checks).
      var routes = ['/work', '/publications', '/bouldering', '/drawing']
      var aliases = { '/projects': '/work' }
      var path = location.pathname.replace(/\/+$/, '')
      path = aliases[path] || path
      location.replace(path === '/resume' ? '/resume.pdf' : routes.indexOf(path) >= 0 ? '/#' + path + location.hash : '/')
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body style="background:#eef1ec"></body>
</html>
